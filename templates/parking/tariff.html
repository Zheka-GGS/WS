{% extends "parking/base.html" %}
{% block title %}Тариф · ParkVision{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">НАЛАШТУВАННЯ ПАРКУВАННЯ</p><h1>Тариф і ліміт сповіщень</h1>
  <p class="muted">Нова ставка застосовується до сесій, створених після її збереження.</p>
  <form method="post" class="form-stack">{% csrf_token %}
    <label for="hourly_rate">Вартість за годину, грн</label><input id="hourly_rate" name="hourly_rate" type="number" step="0.01" min="0" value="{{ tariff.hourly_rate }}" required>
    <label for="alert_limit">Ліміт витрат для сповіщення, грн</label><input id="alert_limit" name="alert_limit" type="number" step="0.01" min="0" value="{{ tariff.alert_limit }}" required>
    <button class="button primary" type="submit">Зберегти тариф</button>
  </form>
</section>
{% endblock %}
