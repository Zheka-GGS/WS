services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkvision}
      POSTGRES_USER: ${POSTGRES_USER:-parkvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ai:
    build: .
    command: ["uvicorn", "ai_api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      PYTHONPATH: /app
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  ai-lab:
    build: .
    command: ["python", "main.py"]
    environment:
      HOST: 0.0.0.0
      PORT: 7860
    ports:
      - "7860:7860"
    restart: unless-stopped

  web:
    build: .
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn parking_project.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkvision}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-parkvision}
      AI_SERVICE_URL: http://ai:8001
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
